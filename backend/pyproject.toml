[project]
name = "ai-girl-api"
version = "0.1.0"
description = "PLOT18 companion chat API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "aiosqlite>=0.20,<1",
  "argon2-cffi>=23,<26",
  "pillow>=10,<13",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "openai>=1.60,<3",
  "pydantic>=2.9,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
